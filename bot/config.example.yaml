# Copia este fichero a config.yaml y ajústalo. Las claves de la API NUNCA van aquí: se leen de
# las variables de entorno BINANCE_API_KEY y BINANCE_API_SECRET.
modo: paper            # paper (simulado con datos reales) | testnet | live
fuente_datos: live     # solo en paper: live (datos reales) | testnet
capital: 10000         # USDT de la cuenta (en paper: capital simulado)
estado: datos_bot/estado.json
diario: datos_bot/diario.csv

riesgo:
  revisar_caida: 0.15  # aviso si la cartera cae un 15 % desde su máximo
  parar_caida: 0.25    # el bot se detiene si cae un 25 %
  apalancamiento_max: 3.0

bloques:               # fracción del capital de cada bloque (validado: 1/4 cada uno de A, B, D, E; F toma un 5 %)
  A_carry:          {activo: true,  fraccion: 0.2375, enter: 0.00015, exit: 0.00005, slots: 3, slot: 0.25, notional_frac: 0.6667, rebal_move: 0.20, K: 20}   # 3 huecos: 25 % de reserva de margen
  E_carry_inverso:  {activo: true,  fraccion: 0.2375, enter: 0.00015, exit: 0.00005, slots: 4, slot: 0.25, notional_frac: 0.6667, K: 30,
                     min_spot_vol: 5000000, borrow_apr_max: 1.5}
  B_corto_alt_btc:  {activo: true,  fraccion: 0.2375, N: 120, m: 5.0, risk: 0.01, max_pos: 10, K: 30, piramidar: false, asegurar_tras_R: 2.0, m_asegurado: 2.5}
  D_tendencia:      {activo: true,  fraccion: 0.2375, N: 120, m: 5.0, risk: 0.05, symbols: [BTCUSDT, ETHUSDT], piramidar: true, filtro_euforia: 0.0003}
  F_fin_de_semana:  {activo: true,  fraccion: 0.05, threshold: 0.01, per_trade_usd: 100, max_frac_per_trade: 0.10}   # candidata: tamaño pequeño
  # Lección 40: motor A del BTC-Strategy-Monitor. seguimiento: true = siempre simulado y fuera del capital.
  G_rafaga:         {activo: true,  seguimiento: false, fraccion: 0.20, risk: 0.0025, filtro_euforia: 0.0003, filtro_figuras: true, symbols: [BTCUSDT, ETHUSDT, SOLUSDT]}
  # Lección 23 (T4): perpetuo > 0,5 % por debajo de su spot → largo futuro + corto spot prestado. En seguimiento: simulado y aparte.
  H_prima:          {activo: true,  seguimiento: true, fraccion: 0.10, slot: 0.25, max_pos: 4, entrada: -0.005, salida: 0.001, max_horas: 24, K: 30}
  # En prueba (siempre simulados, no cuentan en el capital): Lecciones 47, 46 y 37
  I_coinbase:       {activo: true,  seguimiento: true, fraccion: 0.10}
  J_redondos:       {activo: true,  seguimiento: true, fraccion: 0.10, slot: 0.10, max_pos: 10, max_dias: 20, K: 30, stop_atr: 2.0, riesgo: 0.01, max_nocional: 0.30, vol_min: 0.0753}
  K_tokenizadas:    {activo: true,  seguimiento: true, fraccion: 0.10, slot: 0.25, max_pos: 4, entrada: 0.005, salida: 0.001, max_horas: 24}
  L_doble_techo:    {activo: true,  seguimiento: true, fraccion: 0.10, max_pos: 10, K: 100, riesgo: 0.01, max_nocional: 0.30}
  M_B_filtrado:     {activo: true,  seguimiento: true, filtro_funding: 0.0000243}   # copia de B con el filtro de la L58
